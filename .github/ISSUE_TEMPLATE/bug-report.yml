name: Bug Report
description: Report an issue or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide details to help reproduce and resolve the issue.

  - type: input
    id: app-version
    attributes:
      label: UnifiedBuds Version
      placeholder: "e.g. 0.3.0 (3)"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      placeholder: "e.g. macOS 14.5 Sonoma / macOS 15 Sequoia"
    validations:
      required: true

  - type: input
    id: earbud-model
    attributes:
      label: Earbuds / Headphones Model
      placeholder: "e.g. QCY MeloBuds N20, Nothing Ear (2), realme Buds Air 5 Pro"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: "A clear and concise description of what happened."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What did you expect to happen instead?"
    validations:
      required: true

  - type: textarea
    id: debug-log
    attributes:
      label: Bluetooth Debug Info
      description: "From UnifiedBuds › Settings (gear) › About › 'Copy Bluetooth Debug Info'"
      render: text

  - type: textarea
    id: console-logs
    attributes:
      label: Terminal / Console Logs (optional)
      description: "Run `log stream --predicate 'subsystem == \"com.unifiedbuds.app\"'` in Terminal"
      render: text
